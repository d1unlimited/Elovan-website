<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELOVAN — Chat Admin</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{
    --surface:#FFFDF9; --surface-2:#F5EBD9; --surface-3:#EDE0C8;
    --border:#E5D8BE; --border-soft:#EEE3CE;
    --teal:#A9752E; --teal-strong:#C99A4C; --teal-dim:rgba(169,117,46,.12);
    --gold:#7A2E2E;
    --text:#2B2216; --text-muted:#6E5F4C; --text-faint:#9C8B72;
    --success:#4C7A5E; --danger:#B23B3B;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--surface-2);color:var(--text);}
  .topbar{background:var(--text);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;}
  .topbar b{font-size:1rem;}
  .topbar button{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;padding:6px 14px;border-radius:8px;cursor:pointer;font-size:.8rem;}
  #loginScreen{max-width:360px;margin:80px auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;}
  #loginScreen h2{margin-top:0;font-size:1.2rem;}
  #loginScreen input{width:100%;padding:10px 12px;margin-bottom:12px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;}
  #loginScreen button{width:100%;padding:11px;background:var(--teal);color:#fff;border:none;border-radius:8px;font-size:.9rem;cursor:pointer;}
  #loginError{color:var(--danger);font-size:.82rem;margin-bottom:10px;min-height:1em;}
  #app{display:none;height:calc(100vh - 52px);}
  .layout{display:flex;height:100%;}
  .conv-list{width:320px;flex-shrink:0;border-right:1px solid var(--border);background:var(--surface);overflow-y:auto;}
  .conv-item{padding:14px 16px;border-bottom:1px solid var(--border-soft);cursor:pointer;}
  .conv-item:hover{background:var(--surface-2);}
  .conv-item.active{background:var(--teal-dim);border-left:3px solid var(--teal);}
  .conv-item .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .conv-item b{font-size:.86rem;}
  .conv-item .preview{font-size:.78rem;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-item .ctx{font-size:.7rem;color:var(--gold);font-family:monospace;margin-top:2px;}
  .unread-dot{width:8px;height:8px;border-radius:50%;background:var(--gold);flex-shrink:0;}
  .chat-pane{flex:1;display:flex;flex-direction:column;background:var(--surface-2);}
  .chat-pane-head{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 20px;}
  .chat-pane-head b{font-size:.95rem;}
  .chat-pane-head .ctx{font-size:.78rem;color:var(--gold);font-family:monospace;}
  .msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:10px;}
  .msg{max-width:60%;padding:9px 13px;border-radius:12px;font-size:.87rem;line-height:1.45;}
  .msg.visitor{align-self:flex-start;background:var(--surface);border:1px solid var(--border);}
  .msg.agent{align-self:flex-end;background:var(--teal);color:#fff;}
  .msg .ts{font-size:.65rem;opacity:.65;display:block;margin-top:3px;}
  .reply-row{display:flex;gap:10px;padding:14px 20px;background:var(--surface);border-top:1px solid var(--border);}
  .reply-row input{flex:1;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:.88rem;}
  .reply-row button{padding:11px 20px;background:var(--teal);color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:.88rem;}
  .empty{margin:auto;color:var(--text-faint);font-size:.9rem;text-align:center;padding:40px;}
</style>
</head>
<body>

<div id="loginScreen">
  <h2>ELOVAN — Chat Admin</h2>
  <p id="loginError"></p>
  <input type="email" id="loginEmail" placeholder="Admin email">
  <input type="password" id="loginPassword" placeholder="Password">
  <button id="loginBtn">Log in</button>
</div>

<div id="app">
  <div class="topbar">
    <b>ELOVAN — Live Chat Admin</b>
    <button id="logoutBtn">Log out</button>
  </div>
  <div class="layout">
    <div class="conv-list" id="convList"></div>
    <div class="chat-pane" id="chatPane">
      <div class="empty">Select a conversation on the left to view and reply.</div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-database-compat.js"></script>
<script>
  // ⚠️ Use the exact same config as in elovan-website.html — see FIREBASE-SETUP.md
  const firebaseConfig = {
    apiKey: "AIzaSyDDHwUbgLOM4zoHvMumKqFyPmrR_UdYi9o",
    authDomain: "elovan-chat.firebaseapp.com",
    databaseURL: "https://elovan-chat-default-rtdb.firebaseio.com",
    projectId: "elovan-chat",
    storageBucket: "elovan-chat.firebasestorage.app",
    messagingSenderId: "46019176438",
    appId: "1:46019176438:web:042f7f6b711e79cdb149d7"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.database();

  let activeConvId = null;
  let activeMsgsRef = null;

  // ---- LOGIN ----
  document.getElementById('loginBtn').addEventListener('click', login);
  document.getElementById('loginPassword').addEventListener('keydown', e=>{ if(e.key==='Enter') login(); });
  function login(){
    const email = document.getElementById('loginEmail').value.trim();
    const pw = document.getElementById('loginPassword').value;
    document.getElementById('loginError').textContent = '';
    auth.signInWithEmailAndPassword(email, pw).catch(err=>{
      document.getElementById('loginError').textContent = 'Login failed: ' + err.message;
    });
  }
  document.getElementById('logoutBtn').addEventListener('click', ()=>auth.signOut());

  auth.onAuthStateChanged(user=>{
    if(user){
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('app').style.display='block';
      listenConversations();
    } else {
      document.getElementById('loginScreen').style.display='block';
      document.getElementById('app').style.display='none';
    }
  });

  // ---- CONVERSATION LIST ----
  function listenConversations(){
    db.ref('conversations').orderByChild('lastMessageAt').on('value', snap=>{
      const list = document.getElementById('convList');
      const items = [];
      snap.forEach(child=>{ items.push({id:child.key, ...child.val()}); });
      items.reverse(); // newest first
      if(!items.length){ list.innerHTML = '<div class="empty">No conversations yet.</div>'; return; }
      list.innerHTML = items.map(c=>{
        const time = c.lastMessageAt ? new Date(c.lastMessageAt).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
        return `<div class="conv-item ${c.id===activeConvId?'active':''}" data-id="${c.id}">
          <div class="top-row"><b>${c.visitorName || 'Visitor'}</b>${c.unreadByAdmin ? '<span class="unread-dot"></span>' : ''}</div>
          <div class="preview">${(c.lastMessagePreview||'No messages yet')} · ${time}</div>
          ${c.carContext ? `<div class="ctx">${c.carContext}</div>` : ''}
        </div>`;
      }).join('');
      list.querySelectorAll('.conv-item').forEach(el=>{
        el.addEventListener('click', ()=>openConversation(el.dataset.id));
      });
    });
  }

  // ---- OPEN A CONVERSATION ----
  function openConversation(convId){
    activeConvId = convId;
    document.querySelectorAll('.conv-item').forEach(el=>el.classList.toggle('active', el.dataset.id===convId));
    db.ref('conversations/'+convId).update({ unreadByAdmin: false });

    db.ref('conversations/'+convId).once('value').then(snap=>{
      const c = snap.val() || {};
      document.getElementById('chatPane').innerHTML = `
        <div class="chat-pane-head">
          <b>${c.visitorName || 'Visitor'}</b>
          ${c.carContext ? `<div class="ctx">${c.carContext}</div>` : ''}
        </div>
        <div class="msgs" id="msgs"></div>
        <div class="reply-row">
          <input type="text" id="replyInput" placeholder="Type a reply…">
          <button id="replySend">Send</button>
        </div>`;
      document.getElementById('replySend').addEventListener('click', sendReply);
      document.getElementById('replyInput').addEventListener('keydown', e=>{ if(e.key==='Enter') sendReply(); });
    });

    if(activeMsgsRef) activeMsgsRef.off();
    activeMsgsRef = db.ref('conversations/'+convId+'/messages').orderByChild('ts');
    activeMsgsRef.on('value', snap=>{
      const msgsEl = document.getElementById('msgs');
      if(!msgsEl) return;
      msgsEl.innerHTML = '';
      snap.forEach(child=>{
        const m = child.val();
        const time = m.ts ? new Date(m.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        const div = document.createElement('div');
        div.className = 'msg ' + (m.sender==='agent' ? 'agent' : 'visitor');
        div.innerHTML = `${(m.text||'').replace(/</g,'&lt;')}<span class="ts">${time}</span>`;
        msgsEl.appendChild(div);
      });
      msgsEl.scrollTop = msgsEl.scrollHeight;
    });
  }

  function sendReply(){
    const input = document.getElementById('replyInput');
    const text = input.value.trim();
    if(!text || !activeConvId) return;
    db.ref('conversations/'+activeConvId+'/messages').push({
      sender:'agent', text, ts: firebase.database.ServerValue.TIMESTAMP
    });
    db.ref('conversations/'+activeConvId).update({
      lastMessageAt: firebase.database.ServerValue.TIMESTAMP,
      lastMessagePreview: 'You: ' + text.slice(0,140)
    });
    input.value='';
  }
</script>
</body>
</html>
